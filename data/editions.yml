# Editions of the TYPES conference series, most recent first.
#
# The series has 32 editions up to and including 2026, which makes Udine the
# 33rd. It did not meet every year: there was no meeting in 1997, 2001, 2005,
# 2012 or 2020. (A 2020 edition was planned in Torino and has a website, but it
# did not take place, which is why the edition numbers skip it.)
#
# Fields:
#   year, city            required
#   country               omitted for the online edition
#   note                  shown in brackets after the year
#   url                   the edition's website; entries without one are plain text
#   archived: true        the original site is gone and the url is an Internet
#                         Archive snapshot
#
# All links below were checked in September 2026. Editions from 1990 to 1996 and
# 2000 have no website on record.

