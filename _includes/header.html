<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap site-header__bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__name">TYPES&nbsp;2027</span>
      <span class="brand__meta">{{ site.conference.city }} &middot; {{ site.conference.dates }}</span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="nav-toggle__label">Menu</span>
    </button>
  </div>
  <nav class="site-nav" id="site-nav" aria-label="Main">
    <ul class="wrap site-nav__list">
      {%- assign here = page.url | remove: site.baseurl -%}
      {%- for item in site.data.navigation -%}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if here == item.url %}class="is-current" aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
      {%- endfor -%}
    </ul>
  </nav>
</header>
