# --- Site identity -----------------------------------------------------------
title: TYPES 2027
tagline: 33rd International Conference on Types for Proofs and Programs
description: >-
  TYPES 2027, the 33rd International Conference on Types for Proofs and
  Programs, will be held in Udine, Italy, on 7-11 June 2027.

# Temporary address. The repository sits under a personal account whose user
# site carries the custom domain marino.miculan.org, and GitHub applies that
# domain to its project pages too, so the site is served from
# https://marino.miculan.org/types2027.github.io/.
#
# When it moves — to a `types2027` organisation (https://types2027.github.io)
# or to a custom domain such as https://types2027.uniud.it — this is the line
# to change.
#
# `baseurl` stays empty so that local builds work at http://localhost:4000/;
# the deploy workflow passes the right one to `jekyll build` at build time.
url: "https://marino.miculan.org"
baseurl: ""

# --- Conference facts (used throughout the templates) ------------------------
conference:
  acronym: TYPES 2027
  edition: 33rd
  full_name: International Conference on Types for Proofs and Programs
  city: Udine
  country: Italy
  host: Università degli Studi di Udine
  dates: 7-11 June 2027
  start_date: 2027-06-07
  end_date: 2027-06-11
  email: types2027@uniud.it
  chair:
    name: Marino Miculan
    email: marino.miculan@uniud.it
    affiliation: University of Udine

# --- Data --------------------------------------------------------------------
# The data lives in `data/` rather than `_data/` so that the TYPES tooling
# (https://github.com/sattlerc/types-website) can read the same files from the
# path it expects. It must stay excluded from the output: program-committee.json
# carries reviewer email addresses.
data_dir: data

# --- Build -------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - data
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .jekyll-cache
