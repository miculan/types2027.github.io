# --- Site identity -----------------------------------------------------------
title: TYPES 2027
tagline: 33rd International Conference on Types for Proofs and Programs
description: >-
  TYPES 2027, the 33rd International Conference on Types for Proofs and
  Programs, will be held in Udine, Italy, on 7-11 June 2027.

# The repository is the GitHub Pages site of the `types2027` organisation, so it
# is served from the root of https://types2027.github.io and `baseurl` stays
# empty — for an organisation site the deploy workflow gets an empty base path
# from GitHub, and local builds match production.
#
# If a custom domain is added later (say https://types2027.uniud.it), this is
# the line to change.
url: "https://types2027.github.io"
baseurl: ""

# --- Conference facts (used throughout the templates) ------------------------
conference:
  acronym: TYPES 2027
  edition: 33rd
  full_name: International Conference on Types for Proofs and Programs
  city: Udine
  country: Italy
  host: Università degli Studi di Udine
  dates: 7-11 June 2027
  start_date: 2027-06-07
  end_date: 2027-06-11
  email: types2027@uniud.it

# --- Data --------------------------------------------------------------------
# The data lives in `data/` rather than `_data/` so that the TYPES tooling
# (https://github.com/sattlerc/types-website) can read the same files from the
# path it expects. It must stay excluded from the output: program-committee.json
# carries reviewer email addresses.
data_dir: data

# --- Build -------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - data
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .jekyll-cache
