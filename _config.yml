# --- Site identity -----------------------------------------------------------
title: TYPES 2027
tagline: 33rd International Conference on Types for Proofs and Programs
description: >-
  TYPES 2027, the 33rd International Conference on Types for Proofs and
  Programs, will be held in Udine, Italy, on 7-11 June 2027.

# Served from the custom domain types2027.uniud.it, declared both in the CNAME
# file at the root of the repository (so that it survives deploys made through
# GitHub Actions) and in the repository's Pages settings. GitHub redirects
# https://types2027.github.io here.
#
# `baseurl` stays empty: the site is served from the root of the domain.
url: "https://types2027.uniud.it"
baseurl: ""

# --- Conference facts (used throughout the templates) ------------------------
conference:
  acronym: TYPES 2027
  edition: 33rd
  full_name: International Conference on Types for Proofs and Programs
  city: Udine
  country: Italy
  host: Università degli Studi di Udine
  dates: 7-11 June 2027
  start_date: 2027-06-07
  end_date: 2027-06-11
  email: types2027@uniud.it

# --- Data --------------------------------------------------------------------
# The data lives in `data/` rather than `_data/` so that the TYPES tooling
# (https://github.com/sattlerc/types-website) can read the same files from the
# path it expects. It must stay excluded from the output: program-committee.json
# carries reviewer email addresses.
data_dir: data

# --- Build -------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: pretty
sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - data
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .jekyll-cache
